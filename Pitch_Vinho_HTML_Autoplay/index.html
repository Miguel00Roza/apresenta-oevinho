<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitch Vinho — Apresentação</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
.deck{width:100%;height:100%;position:relative;overflow:hidden;background:#111}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#111;opacity:0;visibility:hidden;transform:translateX(4%);transition:opacity .42s ease,transform .42s ease,visibility .42s;pointer-events:none}
.slide.active{opacity:1;visibility:visible;transform:translateX(0);pointer-events:auto;z-index:1}
.slide img{display:block;width:100%;height:100%;object-fit:contain}
.video-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;background:#000}
.controls{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:14px;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,.78));opacity:.25;transition:opacity .2s;z-index:5}
body:hover .controls,.controls:focus-within{opacity:1}
button{border:1px solid #ffffff55;color:#fff;background:#202020dd;border-radius:999px;padding:9px 15px;font-size:14px;cursor:pointer}button:hover{background:#383838}
#counter{min-width:74px;text-align:center;font-size:14px;text-shadow:0 1px 4px #000}
.hint{position:fixed;top:12px;right:14px;color:#fff9;font-size:12px;z-index:5;text-shadow:0 1px 4px #000;transition:opacity .2s}
body.is-fullscreen .controls,body.is-fullscreen .hint{opacity:0!important;visibility:hidden;pointer-events:none}
@media(max-width:600px){.controls{opacity:.9;gap:8px;padding:10px}button{padding:8px 11px}.hint{font-size:10px}}
@media(prefers-reduced-motion:reduce){.slide{transition:none}}
</style></head><body><main class="deck">
<section class="slide" aria-label="Slide 1"><img src="slides/Slide_01.png" alt="Slide 1" draggable="false"></section>
<section class="slide" aria-label="Slide 2"><img src="slides/Slide_02.png" alt="Slide 2" draggable="false"></section>
<section class="slide" aria-label="Slide 3"><img src="slides/Slide_03.png" alt="Slide 3" draggable="false"></section>
<section class="slide" aria-label="Slide 4"><img src="slides/Slide_04.png" alt="Slide 4" draggable="false"></section>
<section class="slide" aria-label="Slide 5"><div class="video-wrap"><video id="slideVideo" controls playsinline preload="metadata"><source src="video-slide-5.mp4" type="video/mp4">Seu navegador não suporta vídeo HTML5.</video></div></section>
<section class="slide" aria-label="Slide 6"><img src="slides/Slide_06.png" alt="Slide 6" draggable="false"></section>
<section class="slide" aria-label="Slide 7"><img src="slides/Slide_07.png" alt="Slide 7" draggable="false"></section>
<section class="slide" aria-label="Slide 8"><img src="slides/Slide_08.png" alt="Slide 8" draggable="false"></section>
<section class="slide" aria-label="Slide 9"><img src="slides/Slide_09.png" alt="Slide 9" draggable="false"></section>
<section class="slide" aria-label="Slide 10"><img src="slides/Slide_10.png" alt="Slide 10" draggable="false"></section>
<section class="slide" aria-label="Slide 11"><img src="slides/Slide_11.png" alt="Slide 11" draggable="false"></section>
<section class="slide" aria-label="Slide 12"><img src="slides/Slide_12.png" alt="Slide 12" draggable="false"></section>
<section class="slide" aria-label="Slide 13"><img src="slides/Slide_13.png" alt="Slide 13" draggable="false"></section>
</main>
<div class="hint">Use ← → ou espaço para navegar • F para tela cheia</div>
<nav class="controls" aria-label="Controles da apresentação">
<button id="prev" type="button">← Anterior</button><span id="counter">1 / 13</span><button id="next" type="button">Próximo →</button><button id="fullscreen" type="button">Tela cheia</button>
</nav>
<script>
(() => {
 const slides=[...document.querySelectorAll('.slide')], counter=document.getElementById('counter'), video=document.getElementById('slideVideo');
 let current=0;
 function show(index){
   const next=Math.max(0,Math.min(slides.length-1,index)); if(next===current)return;
   const old=current; current=next;
   slides[old].classList.remove('active'); slides[current].classList.add('active');
   counter.textContent=`${current+1} / ${slides.length}`;
   if(video) {
     if(current === 4) {
       // Sempre que o slide do vídeo for aberto, volta ao início.
       video.pause();
       video.currentTime = 0;
       // Inicia automaticamente ao entrar no slide. Começa sem áudio
       // para respeitar as políticas de autoplay dos navegadores.
       video.muted = true;
       const startVideo = video.play();
       if (startVideo && typeof startVideo.catch === 'function') startVideo.catch(() => {});
     } else if(!video.paused) {
       video.pause();
     }
   }
 }
 document.getElementById('prev').addEventListener('click',()=>show(current-1));
 document.getElementById('next').addEventListener('click',()=>show(current+1));
 document.getElementById('fullscreen').addEventListener('click',async()=>{
   try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}
 });
 function syncFullscreen(){document.body.classList.toggle('is-fullscreen',Boolean(document.fullscreenElement))}
 document.addEventListener('fullscreenchange',syncFullscreen);
 document.addEventListener('keydown',e=>{
   if(e.target===video) {
     // Keep keyboard controls available to the video player, including seeking and play/pause.
     if(['ArrowLeft','ArrowRight',' '].includes(e.key)) return;
   }
   if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}
   else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}
   else if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
   else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1);
 });
 let touchX=null;
 document.querySelector('.deck').addEventListener('touchstart',e=>{if(e.target.closest('video'))return;touchX=e.changedTouches[0].clientX},{passive:true});
 document.querySelector('.deck').addEventListener('touchend',e=>{if(touchX===null||e.target.closest('video')){touchX=null;return}const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>60)show(current+(dx<0?1:-1));touchX=null},{passive:true});
 slides[0].classList.add('active');syncFullscreen();
})();
</script></body></html>
